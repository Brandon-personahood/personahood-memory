[project]
name = "personahood-memory"
version = "0.1.0"
description = "Portable filesystem wiki memory, live context window, and harvest planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=1.9,<2"]

[project.scripts]
ph-memory = "personahood_memory.cli:main"
ph-memory-mcp = "personahood_memory.mcp_server:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
